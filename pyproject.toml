[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "1.0.0"
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
description = "A powerful command-line tool to automatically organize messy folders by type, date, or custom rules."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/smart-file-organizer"
Repository = "https://github.com/Master-626/smart-file-organizer"
Issues = "https://github.com/Master-626/smart-file-organizer/issues"

[project.scripts]
organize = "file_organizer.cli:main"
