[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "1.1.0"
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
description = "Organize folders by file type, date, or size, with a preview and an undo manifest."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/smart-file-organizer"
Repository = "https://github.com/Master-626/smart-file-organizer"
Issues = "https://github.com/Master-626/smart-file-organizer/issues"

[project.optional-dependencies]
test = ["pytest>=7.0,<9"]
dev = ["pytest>=7.0,<9", "ruff>=0.6"]

[project.scripts]
organize = "file_organizer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["file_organizer"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
